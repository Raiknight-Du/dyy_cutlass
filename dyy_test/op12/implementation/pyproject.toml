[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "op12-gdn"
version = "0.1.0"
description = "B200 E4M3 Gated DeltaNet prefill prototype and validation baseline"
requires-python = ">=3.10"
dependencies = ["torch>=2.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["op12_gdn*"]
